<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0b16" />
      <stop offset="55%" stop-color="#160509" />
      <stop offset="100%" stop-color="#050202" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#e0b34a" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e0b34a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6dd93" />
      <stop offset="45%" stop-color="#d9a83f" />
      <stop offset="100%" stop-color="#9a6c1e" />
    </linearGradient>
    <linearGradient id="goldLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0%" stop-color="#f6dd93" />
      <stop offset="100%" stop-color="#c9932a" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="392" height="472" rx="26" fill="url(#panelGrad)" />
  <rect x="4" y="4" width="392" height="472" rx="26" fill="none" stroke="#c9932a" stroke-width="1.5" />
  <rect x="11" y="11" width="378" height="458" rx="20" fill="none" stroke="#e0b34a" stroke-width="0.75" opacity="0.35" />

  <circle cx="200" cy="230" r="190" fill="url(#glow)" />

  <!-- plinto -->
  <rect x="120" y="392" width="160" height="16" rx="3" fill="url(#gold)" opacity="0.9" />
  <rect x="132" y="376" width="136" height="18" rx="3" fill="none" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.8" />

  <!-- corona d'alloro alla base -->
  <g fill="#c9932a" opacity="0.9">
    <ellipse cx="150" cy="418" rx="7" ry="2.8" transform="rotate(-15 150 418)" />
    <ellipse cx="137" cy="412" rx="7" ry="2.8" transform="rotate(-38 137 412)" />
    <ellipse cx="128" cy="401" rx="6.5" ry="2.6" transform="rotate(-58 128 401)" />
    <ellipse cx="250" cy="418" rx="7" ry="2.8" transform="rotate(15 250 418)" />
    <ellipse cx="263" cy="412" rx="7" ry="2.8" transform="rotate(38 263 412)" />
    <ellipse cx="272" cy="401" rx="6.5" ry="2.6" transform="rotate(58 272 401)" />
  </g>

  <!-- figura seduta: veste -->
  <path d="
    M 158,392
    C 140,392 128,380 130,362
    C 132,340 148,332 152,312
    C 156,290 150,268 168,246
    C 176,236 182,222 184,206
    C 176,196 172,182 176,168
    L 224,168
    C 228,182 224,196 216,206
    C 224,224 244,236 252,254
    C 262,274 258,300 266,322
    C 272,340 270,360 258,376
    C 248,388 232,392 218,392
    Z"
    fill="url(#gold)" />

  <!-- pieghe della veste -->
  <g fill="none" stroke="#5c3f10" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <path d="M 168,246 C 172,270 168,300 160,330 C 155,348 150,364 146,380" />
    <path d="M 200,220 C 202,260 198,300 202,340 C 204,360 206,376 210,390" />
    <path d="M 236,252 C 246,278 248,306 254,332 C 258,352 256,368 250,384" />
  </g>

  <!-- testa -->
  <circle cx="200" cy="140" r="27" fill="url(#gold)" />
  <circle cx="216" cy="120" r="10" fill="url(#gold)" />
  <g fill="#c9932a" opacity="0.9">
    <ellipse cx="195" cy="112" rx="6" ry="2.4" transform="rotate(-20 195 112)" />
    <ellipse cx="205" cy="110" rx="6" ry="2.4" transform="rotate(15 205 110)" />
  </g>

  <!-- collo -->
  <rect x="190" y="162" width="20" height="14" fill="url(#gold)" />

  <!-- braccio sollevato con la bilancia -->
  <path d="M 222,178 C 246,180 260,164 263,142 C 265,128 264,116 262,106"
    fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" />
  <circle cx="262" cy="104" r="8" fill="url(#gold)" />

  <!-- bilancia, ben separata sopra la mano -->
  <line x1="266" y1="98" x2="272" y2="62" stroke="url(#goldLine)" stroke-width="3" stroke-linecap="round" />
  <circle cx="272" cy="60" r="3" fill="url(#gold)" />
  <line x1="246" y1="60" x2="298" y2="60" stroke="url(#goldLine)" stroke-width="3" stroke-linecap="round" />
  <line x1="246" y1="60" x2="246" y2="76" stroke="url(#goldLine)" stroke-width="1.6" />
  <line x1="298" y1="60" x2="298" y2="76" stroke="url(#goldLine)" stroke-width="1.6" />
  <path d="M 236,76 Q 246,88 256,76" fill="none" stroke="url(#goldLine)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 288,76 Q 298,88 308,76" fill="none" stroke="url(#goldLine)" stroke-width="2.2" stroke-linecap="round" />

  <!-- braccio abbassato con la spada -->
  <path d="M 180,178 C 162,186 150,202 146,222 C 143,236 145,250 150,262"
    fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" />
  <circle cx="150" cy="264" r="8" fill="url(#gold)" />

  <!-- spada -->
  <line x1="146" y1="212" x2="140" y2="372" stroke="url(#goldLine)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="128" y1="240" x2="152" y2="234" stroke="url(#goldLine)" stroke-width="3" stroke-linecap="round" />
  <circle cx="140" cy="372" r="4" fill="url(#gold)" />

  <!-- piede scalzo -->
  <ellipse cx="176" cy="386" rx="16" ry="8" fill="url(#gold)" opacity="0.95" />
</svg>
